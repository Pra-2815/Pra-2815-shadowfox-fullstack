<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShadowFox Full Stack Internship</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
        }

        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            color: #4c3c91;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            margin-bottom: 35px;
        }

        .btn {
            display: inline-block;
            margin: 10px;
            padding: 15px 30px;
            background: #6c5ce7;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn:hover {
            background: #5748c9;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>ShadowFox Full Stack Internship</h1>

        <p>
            Completed Beginner and Intermediate Tasks
        </p>

        <a class="btn" href="./beginner/">
            Beginner Task
        </a>

        <a class="btn" href="./intermediate/frontend/">
            Intermediate Task
        </a>

    </div>

</body>

</html>
